[package]
name = "fizz_brain_orchestrator"
version = "0.1.0"
description = "Fizz brain — compose the comment -> sentence-fragment pipeline (classify, few-shot, prompt, LLM, parse). NDJSON in/out CLI."

[dependencies]
fizz_protocol = { git = "https://github.com/Aid-On/fizz-protocol", tag = "v0.2.1" }
fizz_persona = { git = "https://github.com/Aid-On/fizz-persona", tag = "v0.2.0" }
fizz_llm_client = { git = "https://github.com/Aid-On/fizz-llm-client", tag = "v0.1.0" }
fizz_comment_classifier = { git = "https://github.com/Aid-On/fizz-comment-classifier", tag = "v0.1.0" }
fizz_few_shot_retriever = { git = "https://github.com/Aid-On/fizz-few-shot-retriever", tag = "v0.1.0" }
fizz_stream_sentence_parser = { git = "https://github.com/Aid-On/fizz-stream-sentence-parser", tag = "v0.1.0" }
fizz_conversation_history = { git = "https://github.com/Aid-On/fizz-conversation-history", tag = "v0.1.1" }
fizz_thinking_cue_detector = { git = "https://github.com/Aid-On/fizz-thinking-cue-detector", tag = "v0.1.0" }
fizz_prompt_builder = { git = "https://github.com/Aid-On/fizz-prompt-builder", tag = "v0.1.1" }
